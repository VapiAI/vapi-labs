[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vapi-build"
version = "0.3.0"
description = "Agent skill and CLI: raw source material → evidence-linked ontology → agent plan → live Vapi agent with structured outputs and simulations"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
s3 = ["boto3>=1.34"]

[project.scripts]
vapi-build = "vapi_build.cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["vapi_build"]

[tool.setuptools.package-data]
vapi_build = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["scripts/skill_validation.py", "scripts/validate-agent-skills.py"]
